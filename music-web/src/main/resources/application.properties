
# --- KAFKA CONFIGURATION ---
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=tr.com.huseyinaydin.*

# --- METRICS & OBSERVABILITY (Actuator + Prometheus) ---
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=rezonans-music-platform
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# --- ELASTICSEARCH CONFIGURATION ---
spring.elasticsearch.uris=http://localhost:9200

# --- MINIO (LOCAL S3) CONFIGURATION ---
minio.url=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin

# --- RESILIENCE4J CIRCUIT BREAKER CONFIGURATION ---
resilience4j.circuitbreaker.instances.itunesApi.slidingWindowSize=10
resilience4j.circuitbreaker.instances.itunesApi.failureRateThreshold=50
resilience4j.circuitbreaker.instances.itunesApi.waitDurationInOpenState=10000ms
resilience4j.circuitbreaker.instances.itunesApi.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.itunesApi.minimumNumberOfCalls=5

# --- KEYCLOAK OAUTH2 RESOURCE SERVER CONFIGURATION ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/music-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/realms/music-realm/protocol/openid-connect/certs

# --- GRAPHQL CONFIGURATION ---
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql

# --- CASSANDRA NOSQL CONFIGURATION ---
spring.cassandra.keyspace-name=music_keyspace
spring.cassandra.contact-points=localhost
spring.cassandra.port=9042

# --- gRPC SERVER CONFIGURATION ---
grpc.server.port=9090

# --- DISTRIBUTED TRACING CONFIGURATION (Jaeger / Zipkin / OpenTelemetry) ---
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
otel.service.name=rezonans-music-platform
otel.exporter.otlp.endpoint=http://localhost:4317

# --- APACHE SPARK (AI / ML) CONFIGURATION ---
spark.app.name=MusicRecommendationEngine
spark.master=spark://localhost:7077

# --- ORACLE 23c DATABASE & HIBERNATE CONFIGURATION ---
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/FREEPDB1
spring.datasource.username=music_app
spring.datasource.password=music_app_pwd
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.id.new_generator_mappings=true
spring.jpa.properties.hibernate.id.sequence.default_allocation_size=50
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

