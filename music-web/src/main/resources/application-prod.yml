spring:
  datasource:
    url: ${MUSIC_DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${MUSIC_DB_USERNAME:music_app}
    password: ${MUSIC_DB_PASSWORD:music_app_pwd}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1 FROM DUAL
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        id:
          new_generator_mappings: true
          sequence:
            default_allocation_size: 50
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        jdbc.batch_versioned_data: true

logging:
  level:
    root: INFO
    tr.com.huseyinaydin: INFO
    org.hibernate.SQL: ERROR

cors:
  allowed-origins: "https://music.huseyinaydin.com.tr"
