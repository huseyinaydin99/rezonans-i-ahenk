spring:
  datasource:
    url: ${MUSIC_DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${MUSIC_DB_USERNAME:music_app}
    password: ${MUSIC_DB_PASSWORD:music_app_pwd}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true
        id:
          new_generator_mappings: true
          sequence:
            default_allocation_size: 50
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

logging:
  level:
    root: INFO
    tr.com.huseyinaydin: DEBUG
    org.hibernate.SQL: DEBUG

cors:
  allowed-origins: "*"
