spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${MUSIC_DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${MUSIC_DB_USERNAME:music_app}
    password: ${MUSIC_DB_PASSWORD:music_app_pwd}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        id:
          new_generator_mappings: true
          sequence:
            default_allocation_size: 50
        jdbc:
          batch_size: 0
          batch_versioned_data: false
        order_inserts: false
        order_updates: false
  mail:
    password: ${BANKING_SMTP_PASSWORD:secret}

banking:
  jobs:
    pending-reminder:
      cron: "0 0 2 * * ?"
    expired:
      cron: "0 0 3 * * ?"
    audit-cleanup:
      cron: "0 0 0 1 * ?"
  security:
    token-options:
      audience: "music-api"
      issuer: "music-system"
      accessTokenExpiration: 15
      refreshTokenExpiration: 1440
      securityKey: ${BANKING_JWT_SECRET_KEY:ThisIsAVerySecretDefaultKeyForDevOnly123!}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

music:
  playback:
    urls:
      - https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3
      - https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3
      - https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3
      - https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3
      - https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3
  tiers:
    levels:
      Basic: 0
      Gold: 1
      Premium: 2
      Elit: 3
    songs:
      3: Premium
      4: Premium
      5: Elit

