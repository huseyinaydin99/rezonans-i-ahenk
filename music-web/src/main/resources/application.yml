spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${MUSIC_DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${MUSIC_DB_USERNAME:music_app}
    password: ${MUSIC_DB_PASSWORD:music_app_pwd}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        id:
          new_generator_mappings: true
          sequence:
            default_allocation_size: 50
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  mail:
    password: ${BANKING_SMTP_PASSWORD:secret}

banking:
  jobs:
    pending-reminder:
      cron: "0 0 2 * * ?"
    expired:
      cron: "0 0 3 * * ?"
    audit-cleanup:
      cron: "0 0 0 1 * ?"
  security:
    token-options:
      audience: "music-api"
      issuer: "music-system"
      accessTokenExpiration: 15
      refreshTokenExpiration: 1440
      securityKey: ${BANKING_JWT_SECRET_KEY:ThisIsAVerySecretDefaultKeyForDevOnly123!}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
