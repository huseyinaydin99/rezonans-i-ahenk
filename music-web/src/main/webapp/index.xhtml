<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Ana Sayfa - Rezonans-ı Ahenk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>
        .song-card { transition: transform 0.3s ease, box-shadow 0.3s ease; cursor: pointer; }
        .song-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,255,255,0.2) !important; }
        .cover-placeholder { height: 180px; background: linear-gradient(45deg, #1f1c2c, #928DAB); border-radius: 8px 8px 0 0; display: flex; align-items: center; justify-content: center; }
        .horizontal-scroll { display: flex; overflow-x: auto; gap: 1rem; padding-bottom: 1rem; scrollbar-width: thin; scrollbar-color: #0dcaf0 #212529; }
    </style>
</h:head>

<h:body class="bg-dark text-white" onload="#{homeBean.initDashboard()}">
    
    <!-- Navbar Placeholder -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-black py-3 mb-4 border-bottom border-secondary">
        <div class="container">
            <a class="navbar-brand fw-bold text-info" href="#"><i class="fa-solid fa-headphones-simple me-2"></i>Rezonans-ı Ahenk</a>
        </div>
    </nav>

    <div class="container">
        
        <!-- Dinamik Banner (Carousel) -->
        <div id="heroCarousel" class="carousel slide mb-5 shadow-lg rounded-4 overflow-hidden" data-bs-ride="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active" style="height: 300px; background: linear-gradient(90deg, #8E2DE2 0%, #4A00E0 100%);">
                    <div class="d-flex flex-column justify-content-center h-100 p-5">
                        <h1 class="display-4 fw-bold">Yapay Zeka ile Tanış</h1>
                        <p class="lead">Sizin için özel seçtiğimiz şarkılar Spark ML motoruyla hazırlandı.</p>
                        <button class="btn btn-light w-25 rounded-pill fw-bold">Hemen Dinle</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sizin İçin Seçtiklerimiz (Spark ML) -->
        <h4 class="fw-bold mb-3"><i class="fa-solid fa-wand-magic-sparkles text-warning me-2"></i> Sizin İçin Seçtiklerimiz (Yapay Zeka)</h4>
        <div class="horizontal-scroll mb-5">
            <ui:repeat value="#{homeBean.dashboardData.personalizedRecommendations}" var="song">
                <div class="card bg-secondary text-white border-0 shadow-sm song-card" style="min-width: 200px;">
                    <div class="cover-placeholder"><i class="fa-solid fa-music fa-3x text-light opacity-50"></i></div>
                    <div class="card-body">
                        <h6 class="card-title fw-bold text-truncate" title="#{song.title}">#{song.title}</h6>
                        <p class="card-text small text-info">#{song.artist}</p>
                    </div>
                </div>
            </ui:repeat>
        </div>

        <!-- Dünyada En Çok Dinlenenler (Cassandra Big Data) -->
        <h4 class="fw-bold mb-3"><i class="fa-solid fa-earth-americas text-primary me-2"></i> Küresel Top 10</h4>
        <div class="horizontal-scroll mb-5">
            <ui:repeat value="#{homeBean.dashboardData.topGlobalSongs}" var="song">
                <div class="card bg-secondary text-white border-0 shadow-sm song-card" style="min-width: 200px;">
                    <div class="cover-placeholder"><i class="fa-solid fa-fire text-danger fa-3x opacity-50"></i></div>
                    <div class="card-body">
                        <h6 class="card-title fw-bold text-truncate" title="#{song.title}">#{song.title}</h6>
                        <p class="card-text small text-info">#{song.artist}</p>
                    </div>
                </div>
            </ui:repeat>
        </div>

        <!-- Yeni Çıkanlar (Elasticsearch) -->
        <h4 class="fw-bold mb-3"><i class="fa-solid fa-bolt text-warning me-2"></i> Yeni Çıkanlar</h4>
        <div class="horizontal-scroll mb-5">
            <ui:repeat value="#{homeBean.dashboardData.newReleases}" var="song">
                <div class="card bg-secondary text-white border-0 shadow-sm song-card" style="min-width: 200px;">
                    <div class="cover-placeholder"><i class="fa-solid fa-compact-disc text-light fa-3x opacity-50"></i></div>
                    <div class="card-body">
                        <h6 class="card-title fw-bold text-truncate" title="#{song.title}">#{song.title}</h6>
                        <p class="card-text small text-info">#{song.artist}</p>
                    </div>
                </div>
            </ui:repeat>
        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</h:body>
</html>
