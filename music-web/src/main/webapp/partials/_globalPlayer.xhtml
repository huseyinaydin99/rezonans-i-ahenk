<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <h:outputStylesheet library="css" name="player.css" />
    <h:outputScript library="js" name="player.js" target="body" />

    <!--
        Kalıcı Global Müzik Çalar
        - Kuyruk ve aktif şarkı PlayerBean'de (oturum), saniye konumu ve ses seviyesi player.js'te (localStorage).
        - İleri/geri geçişleri JSF AJAX ile yalnızca bu paneli yeniden çizer.
        - Oynatma durumu /api/v1/playback/heartbeat üzerinden Kafka'ya akar.
    -->
    <h:panelGroup id="globalPlayerPanel" layout="block">
        <c:if test="#{playerBean.currentSong != null}">
            <div class="rz-player"
                 id="rzPlayer"
                 data-song-id="#{playerBean.currentSong.id}"
                 data-duration="#{playerBean.currentSong.durationSeconds}"
                 data-user-id="#{sessionScope.USER_ID}"
                 data-token="#{sessionScope.JWT_TOKEN}"
                 data-heartbeat-url="#{request.contextPath}/api/v1/playback/heartbeat">

                <!-- Sol: Şarkı bilgisi -->
                <div class="rz-player__meta">
                    <img class="rz-player__cover" src="#{playerBean.currentSong.coverImageUrl}" alt="Kapak" />
                    <div class="rz-player__info">
                        <span class="rz-player__title" title="#{playerBean.currentSong.title}">#{playerBean.currentSong.title}</span>
                        <span class="rz-player__tier">#{playerBean.currentSong.tier}</span>
                    </div>
                </div>

                <!-- Orta: Kontroller ve ilerleme çubuğu -->
                <div class="rz-player__center">
                    <h:form id="playerNavForm" styleClass="rz-player__controls">
                        <h:commandLink id="prevBtn" action="#{playerBean.previous}"
                                       styleClass="rz-btn" disabled="#{not playerBean.hasPrevious()}"
                                       onclick="RezonansPlayer.reportSkip();" title="Önceki">
                            <i class="fa-solid fa-backward-step"></i>
                            <f:ajax render=":globalPlayerPanel" />
                        </h:commandLink>

                        <button type="button" class="rz-btn rz-btn--primary" data-action="toggle" title="Oynat / Duraklat (Boşluk)">
                            <i class="fa-solid fa-play"></i>
                        </button>

                        <h:commandLink id="nextBtn" action="#{playerBean.next}"
                                       styleClass="rz-btn" disabled="#{not playerBean.hasNext()}"
                                       onclick="RezonansPlayer.reportSkip();" title="Sonraki">
                            <i class="fa-solid fa-forward-step"></i>
                            <f:ajax render=":globalPlayerPanel" />
                        </h:commandLink>

                        <!-- Şarkı bittiğinde JS bu gizli butonu tetikler -->
                        <h:commandLink id="autoNextBtn" action="#{playerBean.next}"
                                       styleClass="d-none" rendered="#{playerBean.hasNext()}">
                            <f:ajax render=":globalPlayerPanel" />
                        </h:commandLink>
                    </h:form>

                    <div class="rz-player__progress">
                        <span class="rz-time" data-role="current">0:00</span>
                        <input type="range" class="rz-range rz-range--seek" data-role="seek"
                               min="0" max="100" step="0.1" value="0" aria-label="Şarkı konumu" />
                        <span class="rz-time" data-role="total">0:00</span>
                    </div>
                </div>

                <!-- Sağ: Ses -->
                <div class="rz-player__right">
                    <button type="button" class="rz-btn" data-action="mute" title="Sessiz (M)">
                        <i class="fa-solid fa-volume-high"></i>
                    </button>
                    <input type="range" class="rz-range rz-range--volume" data-role="volume"
                           min="0" max="1" step="0.01" value="0.8" aria-label="Ses seviyesi" />
                </div>

                <audio id="rzAudio" preload="auto">
                    <source src="#{playerBean.currentSong.audioUrl}" type="audio/mpeg" />
                </audio>
            </div>

            <!-- AJAX ile panel yeniden çizildiğinde oynatıcıyı yeni şarkıyla yeniden bağlar -->
            <script>
                if (window.RezonansPlayer) { window.RezonansPlayer.mount(); }
                else { document.addEventListener("DOMContentLoaded", function () { window.RezonansPlayer.mount(); }); }
            </script>
        </c:if>
    </h:panelGroup>
</ui:composition>
