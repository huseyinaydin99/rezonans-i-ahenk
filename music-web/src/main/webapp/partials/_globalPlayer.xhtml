<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <style>
        .global-player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 90px;
            background-color: #181818; /* Koyu tema */
            color: white;
            border-top: 1px solid #282828;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 9999;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.5);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .gp-left { display: flex; align-items: center; width: 30%; }
        .gp-left img { width: 60px; height: 60px; border-radius: 4px; margin-right: 15px; }
        .gp-info h4 { margin: 0 0 5px 0; font-size: 14px; color: #fff; }
        .gp-info p { margin: 0; font-size: 12px; color: #b3b3b3; }
        .gp-center { flex: 1; display: flex; justify-content: center; align-items: center; }
        .gp-center audio { width: 100%; max-width: 600px; outline: none; }
        .gp-right { width: 30%; display: flex; justify-content: flex-end; }
    </style>

    <h:panelGroup id="globalPlayerPanel" layout="block">
        <c:if test="#{playerBean.currentSong != null}">
            <div class="global-player-bar">
                
                <div class="gp-left">
                    <img src="#{playerBean.currentSong.coverImageUrl}" alt="Cover" />
                    <div class="gp-info">
                        <h4>#{playerBean.currentSong.title}</h4>
                        <p>ID: #{playerBean.currentSong.artistId}</p>
                    </div>
                </div>

                <div class="gp-center">
                    <audio id="mainAudioPlayer" controls="controls" autoplay="autoplay">
                        <source src="#{playerBean.currentSong.audioUrl}" type="audio/mpeg" />
                        Tarayıcınız ses elemanını desteklemiyor.
                    </audio>
                </div>

                <div class="gp-right">
                    <!-- Volume controls or secondary actions could go here -->
                </div>
            </div>
            
            <!-- AJAX tabanlı sayfa geçişlerinde müziğin devam etmesi için JS Hook -->
            <script>
                // Bu script, JSF (veya PrimeFaces) AJAX güncellemelerinde DOM yenilense bile
                // Audio nesnesinin durumunu korumak için tasarlanmış mock bir köprüdür.
                console.log("Global Müzik Çalar Devrede: " + "#{playerBean.currentSong.title}");
            </script>
        </c:if>
    </h:panelGroup>
</ui:composition>
