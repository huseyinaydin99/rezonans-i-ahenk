<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    <!-- Parametre olarak 'song' nesnesi bekleniyor -->
    <div class="song-card">
        <img src="#{song.coverImageUrl}" alt="Cover" class="song-img" />
        <div class="song-info">
            <h5 class="song-title">#{song.title}</h5>
            <span class="song-tier">#{song.tier}</span>
        </div>
        <button class="play-btn">▶ Oynat</button>
    </div>
</ui:composition>
