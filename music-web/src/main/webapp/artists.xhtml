<ui:composition template="/layouts/main.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:define name="title">Sanatçılar Keşfi</ui:define>

    <ui:define name="content">
        <style>
            .artist-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 24px;
                padding: 20px 0;
            }
            .artist-card {
                background: rgba(30, 30, 40, 0.7);
                border-radius: 12px;
                padding: 20px;
                text-align: center;
                transition: transform 0.3s ease, box-shadow 0.3s ease;
                border: 1px solid rgba(255, 255, 255, 0.05);
                text-decoration: none;
                color: white;
                display: block;
            }
            .artist-card:hover {
                transform: translateY(-5px);
                box-shadow: 0 10px 20px rgba(0,0,0,0.4);
                background: rgba(40, 40, 50, 0.9);
                color: white;
            }
            .artist-avatar {
                width: 150px;
                height: 150px;
                border-radius: 50%;
                object-fit: cover;
                margin: 0 auto 15px auto;
                box-shadow: 0 8px 15px rgba(0,0,0,0.5);
                border: 2px solid transparent;
                transition: border-color 0.3s ease;
            }
            .artist-card:hover .artist-avatar { border-color: #0dcaf0; }
            .artist-name { font-weight: bold; font-size: 18px; margin-bottom: 5px; }
            .artist-listeners { font-size: 12px; color: #aaa; }
            .verified-badge { color: #1da1f2; font-size: 16px; margin-left: 5px; }
        </style>

        <div class="mb-5">
            <h2 class="fw-bold mb-1"><i class="fa-solid fa-users text-info me-2"></i>Öne Çıkan Sanatçılar</h2>
            <p class="text-secondary">Retro ızgarada en iyi sanatçıları keşfet</p>
            
            <h:form id="searchForm" class="d-flex mt-4" style="max-width: 400px;">
                <h:inputText value="#{artistDiscoveryBean.searchQuery}" class="form-control bg-dark text-white border-secondary me-2" placeholder="Sanatçı ara..." />
                <h:commandButton action="#{artistDiscoveryBean.searchArtists}" value="Ara" class="btn btn-outline-info">
                    <f:ajax execute="@form" render="artistPanel" />
                </h:commandButton>
            </h:form>
        </div>

        <h:panelGroup id="artistPanel">
            <c:choose>
                <c:when test="#{empty artistDiscoveryBean.artists}">
                    <div class="alert alert-dark text-center py-5 rounded-4 border border-secondary">
                        <i class="fa-solid fa-microphone-slash fa-3x text-secondary mb-3"></i>
                        <h5>Sanatçı Bulunamadı</h5>
                    </div>
                </c:when>
                <c:otherwise>
                    <div class="artist-grid">
                        <c:forEach items="#{artistDiscoveryBean.artists}" var="art">
                            <h:link outcome="artist_detail.xhtml" class="artist-card">
                                <f:param name="id" value="#{art.id}" />
                                <img src="#{art.imageUrl}" alt="#{art.name}" class="artist-avatar" />
                                <div class="artist-name">
                                    #{art.name}
                                    <c:if test="#{art.verified}">
                                        <i class="fa-solid fa-circle-check verified-badge" title="Doğrulanmış"></i>
                                    </c:if>
                                </div>
                                <div class="artist-listeners">
                                    <h:outputText value="#{art.monthlyListeners}">
                                        <f:convertNumber pattern="###,###,###" />
                                    </h:outputText> Aylık Dinleyici
                                </div>
                            </h:link>
                        </c:forEach>
                    </div>
                </c:otherwise>
            </c:choose>
        </h:panelGroup>

    </ui:define>
</ui:composition>
