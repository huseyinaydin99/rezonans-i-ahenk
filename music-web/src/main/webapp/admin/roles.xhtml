<ui:composition template="/layouts/main.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    
    <ui:define name="title">Yetki ve Rol Yönetimi</ui:define>
    
    <ui:define name="content">
        <div class="admin-container">
            <h2>🛡️ Dinamik Yetki Yönetimi</h2>
            <p>Sistem yöneticileri olarak yeni yetki seviyeleri (roller) oluşturabilir ve kullanıcıları bu yetkilerle donatabilirsiniz.</p>
            
            <h:outputText value="#{roleManagerBean.systemMessage}" class="alert alert-info d-block" rendered="#{not empty roleManagerBean.systemMessage}" />
            
            <div class="role-grid" style="display: flex; gap: 2rem; margin-top: 2rem;">
                <!-- Yeni Rol Oluşturma -->
                <div class="role-card" style="flex: 1; padding: 1.5rem; border: 1px solid #ccc; border-radius: 8px;">
                    <h4>Yeni Rol (Operation Claim) Oluştur</h4>
                    <h:form>
                        <div class="form-group">
                            <label>Rol Adı (Örn: EDITOR, MODERATOR)</label>
                            <h:inputText value="#{roleManagerBean.newRoleName}" class="form-control" />
                        </div>
                        <h:commandButton action="#{roleManagerBean.createRole}" value="Oluştur" class="btn btn-primary mt-2" />
                    </h:form>
                </div>

                <!-- Kullanıcıya Rol Atama -->
                <div class="role-card" style="flex: 1; padding: 1.5rem; border: 1px solid #ccc; border-radius: 8px;">
                    <h4>Kullanıcıya Yetki Ata</h4>
                    <h:form>
                        <div class="form-group">
                            <label>Kullanıcı ID (UUID)</label>
                            <h:inputText value="#{roleManagerBean.targetUserId}" class="form-control" />
                        </div>
                        <div class="form-group mt-2">
                            <label>Atanacak Rol</label>
                            <h:inputText value="#{roleManagerBean.selectedRoleToAssign}" class="form-control" />
                        </div>
                        <h:commandButton action="#{roleManagerBean.assignRole}" value="Yetkilendir" class="btn btn-warning mt-2" />
                    </h:form>
                </div>
            </div>
        </div>
    </ui:define>
</ui:composition>
