<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Profil Ayarları - Rezonans-ı Ahenk</title>
    <!-- Bootstrap CSS varsayılıyor -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</h:head>

<h:body class="bg-dark text-white">
    <div class="container mt-5">
        <h2><i class="fa-solid fa-user-gear"></i> Profil Ayarları</h2>
        <hr/>
        
        <!-- Dosya yükleme (File Upload) yapılacağı için enctype="multipart/form-data" KESİNLİKLE şarttır -->
        <h:form enctype="multipart/form-data" class="col-md-6">
            
            <div class="mb-3">
                <label class="form-label">Profil Fotoğrafı (MinIO Bulutuna Yüklenecek)</label>
                <h:inputFile value="#{profileBean.profileImage}" class="form-control bg-secondary text-white" />
            </div>

            <div class="mb-3">
                <label class="form-label">Biyografi (Hakkımda)</label>
                <h:inputTextarea value="#{profileBean.bio}" rows="4" class="form-control bg-secondary text-white" />
            </div>

            <div class="mb-3">
                <label class="form-label">Mevcut Şifre</label>
                <h:inputSecret value="#{profileBean.currentPassword}" class="form-control bg-secondary text-white" />
            </div>

            <div class="mb-3">
                <label class="form-label">Yeni Şifre</label>
                <h:inputSecret value="#{profileBean.newPassword}" class="form-control bg-secondary text-white" />
            </div>

            <h:commandButton value="Değişiklikleri Kaydet" action="#{profileBean.saveProfile}" class="btn btn-success" />
            
        </h:form>
    </div>
</h:body>
</html>
