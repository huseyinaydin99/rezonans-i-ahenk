<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Keşfet (Browse) - Rezonans-ı Ahenk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</h:head>

<h:body class="bg-dark text-white" onload="#{browseBean.loadGenres()}">
    <div class="container mt-5">
        <h2><i class="fa-solid fa-compass text-info"></i> Keşfet (Müzik Türleri)</h2>
        <p class="text-secondary">Ruh halinize en uygun kategoriyi seçin ve yeni ufuklara yelken açın.</p>
        <hr class="mb-4"/>
        
        <div class="row">
            <!-- Sol Panel: Kategoriler (Genres Grid) -->
            <div class="col-md-7">
                <div class="row">
                    <ui:repeat value="#{browseBean.genres}" var="genre">
                        <div class="col-md-4 mb-3">
                            <h:form>
                                <!-- JSF AJAX kullanarak sayfayı yenilemeden sağ paneli güncelleyeceğiz -->
                                <h:commandLink action="#{browseBean.selectGenre(genre.id)}" styleClass="text-decoration-none">
                                    <f:ajax execute="@this" render=":detailPanel" />
                                    <div class="card text-white text-center border-0 shadow-sm" style="background-color: #{genre.colorHex}; height: 120px; border-radius: 12px; transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
                                        <div class="card-body d-flex align-items-center justify-content-center">
                                            <h4 class="card-title fw-bold m-0 text-shadow">#{genre.name}</h4>
                                        </div>
                                    </div>
                                </h:commandLink>
                            </h:form>
                        </div>
                    </ui:repeat>
                </div>
            </div>

            <!-- Sağ Panel: Seçilen Türün Detayı (AJAX ile Güncellenir) -->
            <div class="col-md-5">
                <h:panelGroup id="detailPanel">
                    <h:panelGroup rendered="#{empty browseBean.selectedGenreDetail}">
                        <div class="alert alert-secondary bg-transparent border-secondary text-center p-5 rounded-4">
                            <i class="fa-solid fa-music fa-3x mb-3 text-secondary"></i>
                            <h5>Keşfetmeye Başla</h5>
                            <p class="small">Popüler şarkıları görmek için soldaki kategorilerden birine tıklayın.</p>
                        </div>
                    </h:panelGroup>
                    
                    <h:panelGroup rendered="#{not empty browseBean.selectedGenreDetail}">
                        <div class="card bg-secondary text-white border-0 shadow rounded-4">
                            <div class="card-header bg-dark border-0 py-3">
                                <h4 class="m-0"><i class="fa-solid fa-fire text-danger"></i> #{browseBean.selectedGenreDetail.genreName}</h4>
                            </div>
                            <div class="card-body p-0">
                                <ul class="list-group list-group-flush">
                                    <ui:repeat value="#{browseBean.selectedGenreDetail.topSongs}" var="song">
                                        <li class="list-group-item bg-transparent text-white border-dark d-flex align-items-center py-3 px-4">
                                            <i class="fa-solid fa-play-circle fa-2x me-3 text-info"></i>
                                            <span class="fw-bold">#{song}</span>
                                        </li>
                                    </ui:repeat>
                                </ul>
                            </div>
                        </div>
                    </h:panelGroup>
                </h:panelGroup>
            </div>
        </div>
    </div>
</h:body>
</html>
