<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Premium Satın Al - Rezonans-ı Ahenk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</h:head>

<h:body class="bg-dark text-white">
    <div class="container mt-5">
        <h2 class="text-center mb-4"><i class="fa-solid fa-crown text-warning"></i> Sınırları Kaldır, Müziği Hisset</h2>
        <hr class="mb-5"/>
        
        <div class="row justify-content-center">
            <div class="col-md-6">
                
                <!-- Ödeme Sonucu Gösterimi -->
                <h:panelGroup id="resultPanel">
                    <h:panelGroup rendered="#{not empty checkoutBean.result}">
                        <div class="alert #{checkoutBean.result.success ? 'alert-success' : 'alert-danger'} fw-bold">
                            <i class="fa-solid #{checkoutBean.result.success ? 'fa-check-circle' : 'fa-circle-xmark'}"></i>
                            #{checkoutBean.result.message}
                            <h:outputText value=" (İşlem No: #{checkoutBean.result.transactionId})" rendered="#{checkoutBean.result.success}" />
                        </div>
                    </h:panelGroup>
                </h:panelGroup>

                <h:form id="checkoutForm" class="card bg-secondary text-white p-4 shadow-lg border-0">
                    <h4 class="mb-4">Ödeme Bilgileri</h4>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Paket Seçimi</label>
                        <h:selectOneMenu value="#{checkoutBean.selectedTierStr}" class="form-select bg-dark text-white border-0">
                            <f:selectItem itemValue="PREMIUM" itemLabel="Premium Paket (Sınırsız Atlama) - 39.99 ₺" />
                            <f:selectItem itemValue="ELITE" itemLabel="Elite Paket (Hi-Fi Ses &amp; Reklamsız) - 79.99 ₺" />
                        </h:selectOneMenu>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Kart Üzerindeki İsim</label>
                        <h:inputText value="#{checkoutBean.cardName}" class="form-control bg-dark text-white border-0" required="true" />
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Kredi Kartı Numarası</label>
                        <h:inputText value="#{checkoutBean.cardNumber}" class="form-control bg-dark text-white border-0" required="true">
                            <f:passThroughAttribute name="placeholder" value="XXXX XXXX XXXX XXXX" />
                        </h:inputText>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label class="form-label fw-bold">CVV</label>
                            <h:inputSecret value="#{checkoutBean.cvv}" class="form-control bg-dark text-white border-0" required="true" />
                        </div>
                    </div>

                    <!-- AJAX destekli Ödeme Butonu -->
                    <h:commandButton value="Güvenli Ödeme Yap" action="#{checkoutBean.processOrder}" styleClass="btn btn-warning w-100 fw-bold py-2">
                        <f:ajax execute="@form" render="resultPanel checkoutForm" />
                    </h:commandButton>
                </h:form>
                
            </div>
        </div>
    </div>
</h:body>
</html>
