<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Favorilerim - Rezonans-ı Ahenk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <!-- FontAwesome for Heart Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</h:head>

<h:body class="bg-dark text-white" onload="#{likeBean.loadLikedSongs()}">
    <div class="container mt-5">
        <h2><i class="fa-solid fa-heart text-danger"></i> Beğendiğim Şarkılar</h2>
        <hr/>
        
        <!-- Örnek AJAX Destekli Beğeni Butonu (Sayfa Yenilenmeden) -->
        <h:form id="likeForm">
            <div class="card bg-secondary text-white mb-3" style="width: 18rem;">
                <div class="card-body">
                    <h5 class="card-title">Örnek Şarkı</h5>
                    <p class="card-text">Sistemi test etmek için...</p>
                    
                    <h:commandLink action="#{likeBean.toggleFavorite('a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d')}" 
                                   styleClass="btn btn-dark">
                        <!-- Sayfa yenilenmesini engelleyip sadece butonu (likeIcon) günceller -->
                        <f:ajax render="likeIcon" />
                        
                        <h:panelGroup id="likeIcon">
                            <!-- Java Bean'den gelen Boolean'a göre ikon değişir -->
                            <i class="fa-heart #{likeBean.isLiked ? 'fa-solid text-danger' : 'fa-regular'} fa-2x"></i>
                        </h:panelGroup>
                    </h:commandLink>
                </div>
            </div>
        </h:form>

        <h3 class="mt-5">Kitaplığım</h3>
        <ul class="list-group">
            <ui:repeat value="#{likeBean.userLikedSongs}" var="songTitle">
                <li class="list-group-item bg-secondary text-white border-dark">
                    <i class="fa-solid fa-music me-2"></i> #{songTitle}
                </li>
            </ui:repeat>
        </ul>
    </div>
</h:body>
</html>
