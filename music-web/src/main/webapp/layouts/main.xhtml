<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title><ui:insert name="title">Müzik Platformu</ui:insert></title>
    
    <!-- Bootstrap CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    
    <!-- FontAwesome (İkonlar) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    
    <!-- JSF Resource Management (Özel Stilimiz) -->
    <h:outputStylesheet library="css" name="style.css" />
</h:head>
<h:body>
    
    <!-- Dinamik Navbar Yüklemesi -->
    <ui:include src="/partials/_navbar.xhtml" />

    <div class="container main-content mt-4">
        <ui:insert name="content">
            <!-- Sayfalardan Enjekte Edilecek İçerik Buraya Gelecek -->
        </ui:insert>
    </div>

    <!-- Global Playlist Modal -->
    <ui:include src="/partials/_playlistActionMenu.xhtml" />

    <!-- Kalıcı Global Müzik Çalar (Önceki Adımda Tasarlanmıştı) -->
    <ui:include src="/partials/_globalPlayer.xhtml" />

    <!-- Bootstrap JS (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Özel Javascript -->
    <h:outputScript library="js" name="app.js" />
</h:body>
</html>
