<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Giriş Yap - Rezonans-ı Ahenk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>
        .login-bg { background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%); min-height: 100vh; }
        .login-card { background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(15px); border-radius: 15px; border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</h:head>

<h:body class="login-bg d-flex align-items-center justify-content-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card login-card text-white shadow-lg p-5">
                    <div class="text-center mb-4">
                        <i class="fa-solid fa-compact-disc fa-spin-pulse fa-3x text-info mb-3"></i>
                        <h3 class="fw-bold">Tekrar Hoş Geldin</h3>
                        <p class="text-secondary small">Müzik kitaplığına erişmek için giriş yap.</p>
                    </div>

                    <h:form id="loginForm">
                        
                        <!-- AJAX Sonuç Mesajı -->
                        <h:panelGroup id="resultMsg">
                            <h:outputText value="#{loginBean.message}" 
                                          styleClass="alert #{loginBean.success ? 'alert-success' : 'alert-danger'} d-block mb-4 fw-bold p-2 text-center" 
                                          rendered="#{not empty loginBean.message}" />
                        </h:panelGroup>

                        <div class="mb-3">
                            <label class="form-label text-light fw-bold">E-Posta Adresi</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark border-secondary text-info"><i class="fa-solid fa-envelope"></i></span>
                                <h:inputText value="#{loginBean.email}" class="form-control bg-dark text-white border-secondary" required="true" />
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label text-light fw-bold">Şifre</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark border-secondary text-info"><i class="fa-solid fa-lock"></i></span>
                                <h:inputSecret value="#{loginBean.password}" class="form-control bg-dark text-white border-secondary" required="true" />
                            </div>
                            <div class="text-end mt-1">
                                <a href="#" class="text-secondary text-decoration-none small">Şifremi Unuttum</a>
                            </div>
                        </div>

                        <h:commandButton value="Güvenli Giriş Yap" action="#{loginBean.doLogin}" styleClass="btn btn-info text-dark w-100 fw-bold py-2 rounded-3 shadow-sm mb-3">
                            <!-- Sayfa yenilenmesini engeller, asenkron JWT akışı sağlar -->
                            <f:ajax execute="@form" render="resultMsg" />
                        </h:commandButton>
                        
                        <div class="text-center">
                            <span class="text-secondary small">Hesabın yok mu? <a href="register.xhtml" class="text-info text-decoration-none fw-bold">Kayıt Ol</a></span>
                        </div>
                    </h:form>
                </div>
            </div>
        </div>
    </div>
</h:body>
</html>
