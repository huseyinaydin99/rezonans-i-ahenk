<ui:composition template="/WEB-INF/layout.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    <ui:define name="title">Tür Detayı</ui:define>
    <ui:define name="content">
        <h1 class="fv-title">Tür: Pop Müzik</h1>
        <p class="fv-subtitle mb-4">Bu türe ait en popüler şarkılar.</p>
        
        <div class="mg-hero-strip" style="display: flex; gap: 1rem; flex-wrap: wrap;">
            <div class="mg-card mg-card--tier-3" style="width: 200px;">
                <div class="mg-card-cover">
                    <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=200" alt="Song" />
                    <div class="mg-card-play-overlay">
                        <button class="mg-card-play" onclick="player.playFrom(20)"><span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">play_arrow</span></button>
                    </div>
                </div>
                <div class="mg-card-title-row"><h4 class="mg-card-title">Dance Monkey</h4></div>
                <p class="mg-card-artist">Tones And I</p>
            </div>
            
            <div class="mg-card mg-card--tier-1" style="width: 200px;">
                <div class="mg-card-cover">
                    <img src="https://images.unsplash.com/photo-1493225457124-a1a2a53b51ee?w=200" alt="Song" />
                    <div class="mg-card-play-overlay">
                        <button class="mg-card-play" onclick="player.playFrom(21)"><span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">play_arrow</span></button>
                    </div>
                </div>
                <div class="mg-card-title-row"><h4 class="mg-card-title">Watermelon Sugar</h4></div>
                <p class="mg-card-artist">Harry Styles</p>
            </div>
        </div>
    </ui:define>
</ui:composition>
