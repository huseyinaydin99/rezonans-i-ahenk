<ui:composition template="/layouts/main.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    <ui:define name="title">Giriş Yap</ui:define>
    <ui:define name="content">
        <div class="auth-container">
            <h2>Müziğe Katıl</h2>
            <h:form>
                <div class="form-group">
                    <label>Email</label>
                    <h:inputText value="#{authBean.email}" class="form-control" />
                </div>
                <div class="form-group">
                    <label>Şifre</label>
                    <h:inputSecret value="#{authBean.password}" class="form-control" />
                </div>
                <h:commandButton action="#{authBean.login}" value="Giriş Yap" class="btn btn-primary" />
            </h:form>
        </div>
    </ui:define>
</ui:composition>
