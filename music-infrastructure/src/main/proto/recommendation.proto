syntax = "proto3";

package tr.com.huseyinaydin.grpc;
option java_multiple_files = true;
option java_package = "tr.com.huseyinaydin.infrastructure.grpc.generated";

// İkili (Binary) formatta haberleşecek olan yüksek performanslı gRPC servisi
service RecommendationService {
    rpc GetRecommendations (RecommendationRequest) returns (RecommendationResponse);
}

message RecommendationRequest {
    string userId = 1;
    int32 limit = 2;
}

message SongMessage {
    string id = 1;
    string title = 2;
    string artistName = 3;
    string audioUrl = 4;
}

message RecommendationResponse {
    repeated SongMessage songs = 1;
}
