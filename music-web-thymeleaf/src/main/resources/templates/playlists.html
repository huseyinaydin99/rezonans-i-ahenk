<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<body>

    <div layout:fragment="title">Playlistlerim</div>
    <div layout:fragment="content">
        <h1 class="fv-title">Playlistlerim</h1>
        <p class="fv-subtitle mb-4">Kendi frekans koleksiyonlarını oluştur ve düzenle.</p>
        
        <form class="pl-create">
            <input type="text" name="name" placeholder="Yeni playlist adı" required="required" />
            <button type="button">
                <span class="material-symbols-outlined" style="vertical-align:middle; font-size:18px;">add</span>
                Oluştur
            </button>
        </form>
        
        <div class="pl-grid">
            <a th:href="@{/playlists}" class="pl-card">
                <div class="pl-card-icon">
                    <span class="material-symbols-outlined">queue_music</span>
                </div>
                <div class="pl-card-name">Yol Şarkıları</div>
                <div class="pl-card-count">42 şarkı</div>
            </a>
            <a th:href="@{/playlists}" class="pl-card">
                <div class="pl-card-icon">
                    <span class="material-symbols-outlined">queue_music</span>
                </div>
                <div class="pl-card-name">Spor &amp; Motivasyon</div>
                <div class="pl-card-count">18 şarkı</div>
            </a>
        </div>
    </div>


</body>
</html>
