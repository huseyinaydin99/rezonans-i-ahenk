<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<body>

    <div layout:fragment="title">Sanatçı Detayı</div>
    <div layout:fragment="content">
        <h1 class="fv-title">Sanatçı: The Weeknd</h1>
        <p class="fv-subtitle mb-4">Popüler şarkıları burada.</p>
        
        <div class="mg-hero-strip" style="display: flex; gap: 1rem; flex-wrap: wrap;">
            <div class="mg-card mg-card--tier-1" style="width: 200px;">
                <div class="mg-card-cover">
                    <img src="https://images.unsplash.com/photo-1614680376593-902f74cf0d41?w=200" alt="Song" />
                    <div class="mg-card-play-overlay">
                        <button class="mg-card-play" onclick="player.playFrom(10)"><span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">play_arrow</span></button>
                    </div>
                </div>
                <div class="mg-card-title-row"><h4 class="mg-card-title">Blinding Lights</h4></div>
                <p class="mg-card-artist">The Weeknd</p>
            </div>
            
            <div class="mg-card mg-card--tier-2" style="width: 200px;">
                <div class="mg-card-cover">
                    <img src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=200" alt="Song" />
                    <div class="mg-card-play-overlay">
                        <button class="mg-card-play" onclick="player.playFrom(11)"><span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">play_arrow</span></button>
                    </div>
                </div>
                <div class="mg-card-title-row"><h4 class="mg-card-title">Starboy</h4></div>
                <p class="mg-card-artist">The Weeknd</p>
            </div>
        </div>
    </div>


</body>
</html>
