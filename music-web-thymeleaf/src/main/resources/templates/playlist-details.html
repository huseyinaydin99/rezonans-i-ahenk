<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<body>

    <div layout:fragment="title">Playlist Detayı</div>
    <div layout:fragment="content">
        <h1 class="fv-title">Playlist: Favorilerim</h1>
        <p class="fv-subtitle mb-4">Sizin için seçilen harika şarkılar.</p>
        
        <div class="mg-hero-strip" style="display: flex; gap: 1rem; flex-wrap: wrap;">
            <div class="mg-card mg-card--tier-1" style="width: 200px;">
                <div class="mg-card-cover">
                    <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=200" alt="Song" />
                    <div class="mg-card-play-overlay">
                        <button class="mg-card-play" onclick="player.playFrom(30)"><span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">play_arrow</span></button>
                    </div>
                </div>
                <div class="mg-card-title-row"><h4 class="mg-card-title">My Favorite Track</h4></div>
                <p class="mg-card-artist">Various Artists</p>
            </div>
            
            <div class="mg-card mg-card--tier-2" style="width: 200px;">
                <div class="mg-card-cover">
                    <img src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=200" alt="Song" />
                    <div class="mg-card-play-overlay">
                        <button class="mg-card-play" onclick="player.playFrom(31)"><span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">play_arrow</span></button>
                    </div>
                </div>
                <div class="mg-card-title-row"><h4 class="mg-card-title">Chill Vibes</h4></div>
                <p class="mg-card-artist">Lofi Boy</p>
            </div>
        </div>
    </div>


</body>
</html>
