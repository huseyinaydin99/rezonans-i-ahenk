<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">

<head>
    <title>Çalma Listelerim - Rezonans-ı Ahenk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>

<!-- Sayfa yüklenirken veritabanından listeleri çeker -->
<body class="bg-dark text-white" onload="#{playlistBean.loadPlaylists()}">
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fa-solid fa-list-ul text-info"></i> Çalma Listelerim (Library)</h2>
            <!-- Modal Tetikleyici Buton (Bootstrap) -->
            <button type="button" class="btn btn-info text-dark fw-bold" data-bs-toggle="modal" data-bs-toggle="modal" data-bs-target="#createPlaylistModal">
                <i class="fa-solid fa-plus"></i> Yeni Liste Oluştur
            </button>
        </div>
        <hr class="mb-4"/>
        
        <!-- Çalma Listeleri Gösterim Paneli (AJAX ile güncellenir) -->
        <h:panelGroup id="playlistsPanel">
            <div class="row">
                <ui:repeat value="#{playlistBean.userPlaylists}" var="playlist">
                    <div class="col-md-4 mb-4">
                        <div class="card bg-secondary text-white border-dark h-100 shadow">
                            <div class="card-body">
                                <h5 class="card-title text-info"><i class="fa-solid fa-compact-disc"></i> #{playlist.name}</h5>
                                <p class="card-text small text-light">#{playlist.description}</p>
                                <hr/>
                                <h6 class="text-warning">Şarkılar:</h6>
                                <ul class="list-unstyled small">
                                    <ui:repeat value="#{playlist.songTitles}" var="song">
                                        <li><i class="fa-solid fa-music"></i> #{song}</li>
                                    </ui:repeat>
                                </ul>
                            </div>
                            <div class="card-footer bg-dark border-0">
                                <h:form>
                                    <h:commandButton value="Buna Şarkı Ekle (Örnek)" action="#{playlistBean.addMockSongToPlaylist(playlist.id)}" styleClass="btn btn-outline-light btn-sm w-100">
                                        <f:ajax execute="@form" render="playlistsPanel" />
                                    </h:commandButton>
                                </h:form>
                            </div>
                        </div>
                    </div>
                </ui:repeat>
            </div>
        </h:panelGroup>

        <!-- Yeni Liste Oluşturma Modalı -->
        <div class="modal fade" id="createPlaylistModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content bg-dark text-white border-info">
                    <div class="modal-header border-0">
                        <h5 class="modal-title"><i class="fa-solid fa-plus-circle"></i> Yeni Çalma Listesi</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <h:form id="createForm">
                        <div class="modal-body">
                            <div class="mb-3">
                                <label class="form-label">Liste Adı</label>
                                <h:inputText value="#{playlistBean.newPlaylistName}" class="form-control bg-secondary text-white border-0" required="true" />
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Açıklama</label>
                                <h:inputTextarea value="#{playlistBean.newPlaylistDescription}" rows="3" class="form-control bg-secondary text-white border-0" />
                            </div>
                        </div>
                        <div class="modal-footer border-0">
                            <!-- JSF AJAX ile sayfayı yenilemeden listeyi kaydeder ve arayüzdeki listeleri günceller -->
                            <h:commandButton value="Oluştur" action="#{playlistBean.createNewPlaylist}" styleClass="btn btn-info text-dark fw-bold" onclick="$('#createPlaylistModal').modal('hide');">
                                <f:ajax execute="@form" render="playlistsPanel createForm" />
                            </h:commandButton>
                        </div>
                    </h:form>
                </div>
            </div>
        </div>

    </div>
    <!-- Bootstrap JS (Modal için) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</body>
</html>
