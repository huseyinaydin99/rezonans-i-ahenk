<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{auth-layout}">
<head>
    <title>Giriş Yap - Rezonans-ı Ahenk</title>
</head>
<body class="login-bg d-flex align-items-center justify-content-center">
    <div layout:fragment="content">
        <div class="container d-flex align-items-center justify-content-center" style="min-height: 80vh;">
            <div class="row justify-content-center w-100">
                <div class="col-md-4">
                    <div class="card login-card text-white shadow-lg p-5" style="background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(15px); border-radius: 15px; border: 1px solid rgba(255, 255, 255, 0.05);">
                        <div class="text-center mb-4">
                            <span class="material-symbols-outlined mb-3 text-info" style="font-size: 48px;">album</span>
                            <h3 class="fw-bold">Tekrar Hoş Geldin</h3>
                            <p class="text-secondary small">Müzik kitaplığına erişmek için giriş yap.</p>
                        </div>

                        <!-- Hata Mesajı -->
                        <div th:if="${error != null}" class="alert alert-danger d-block mb-3 fw-bold" th:text="${error}"></div>

                        <form th:action="@{/doLogin}" method="post">
                            <div class="mb-3">
                                <label class="form-label text-light fw-bold">E-Posta Adresi</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark border-secondary text-info"><span class="material-symbols-outlined" style="font-size: 18px;">mail</span></span>
                                    <input type="email" name="email" class="form-control bg-dark text-white border-secondary" required="required" />
                                </div>
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label text-light fw-bold">Şifre</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark border-secondary text-info"><span class="material-symbols-outlined" style="font-size: 18px;">lock</span></span>
                                    <input type="password" name="password" class="form-control bg-dark text-white border-secondary" required="required" />
                                </div>
                            </div>

                            <button type="submit" class="btn btn-info text-dark w-100 fw-bold py-2 rounded-3 shadow-sm mb-3">Güvenli Giriş Yap</button>
                            
                            <div class="text-center">
                                <span class="text-secondary small">Hesabın yok mu? <a th:href="@{/register}" class="text-info text-decoration-none fw-bold">Kayıt Ol</a></span>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
