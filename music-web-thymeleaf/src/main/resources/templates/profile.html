<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>Profilim</title>
</head>
<body>
    <div layout:fragment="content">
        <!-- Bildirim Mesajları -->
        <div th:if="${errorMessage}" class="alert-box alert-box--error" style="background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; border-radius: 10px; padding: 12px 18px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px;">
            <span class="material-symbols-outlined" style="color: #ef4444;">error</span>
            <span th:text="${errorMessage}"></span>
        </div>
        <div th:if="${successMessage}" class="alert-box alert-box--success" style="background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.3); color: #6ee7b7; border-radius: 10px; padding: 12px 18px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px;">
            <span class="material-symbols-outlined" style="color: #10b981;">check_circle</span>
            <span th:text="${successMessage}"></span>
        </div>

        <section class="pr-hero">
            <div class="pr-avatar-wrap">
                <div class="pr-avatar">
                    <img th:if="${profile != null and profile.avatarUrl != null}" 
                         th:src="${profile.avatarUrl}" 
                         th:alt="${profile.fullName}" 
                         onerror="this.style.display='none'; if(this.nextElementSibling) this.nextElementSibling.style.display='flex';" />
                    <div class="pr-avatar-fallback" 
                         th:style="${profile != null and profile.avatarUrl != null ? 'display: none;' : 'display: flex;'}"
                         th:text="${profile != null ? profile.initials : 'AS'}">AS</div>
                </div>
                <span class="pr-tier-pill" th:text="${profile != null and profile.tier != null ? #strings.toUpperCase(profile.tier) : 'PREMIUM'}">PREMIUM</span>
            </div>

            <div>
                <h1 class="pr-name" th:text="${profile != null and profile.fullName != null ? profile.fullName : 'Aslı Selin'}">Aslı Selin</h1>
                <p class="pr-username" th:text="${profile != null and profile.username != null ? '@' + profile.username : '@testuser'}">@testuser</p>
                <p class="pr-email">
                    <span class="material-symbols-outlined">mail</span>
                    <span th:text="${profile != null and profile.email != null ? profile.email : 'testuser@example.com'}">testuser@example.com</span>
                </p>

                <div class="pr-actions">
                    <a th:href="@{/edit-profile}" class="pr-btn-edit">
                        <span class="material-symbols-outlined">edit</span>
                        Profili Düzenle
                    </a>
                    <button type="button" class="pr-btn-share" onclick="shareProfile()">
                        <span class="material-symbols-outlined">share</span>
                        Paylaş
                    </button>
                </div>
            </div>
        </section>

        <div class="pr-stats">
            <div class="pr-stat-card pr-stat-card--playlist">
                <div class="pr-stat-icon"><span class="material-symbols-outlined">queue_music</span></div>
                <div>
                    <div class="pr-stat-label">PLAYLİST</div>
                    <div class="pr-stat-value" th:text="${playlistCount != null ? playlistCount : 2}">2</div>
                </div>
            </div>
            <div class="pr-stat-card pr-stat-card--like">
                <div class="pr-stat-icon"><span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">favorite</span></div>
                <div>
                    <div class="pr-stat-label">BEĞENİ</div>
                    <div class="pr-stat-value" th:text="${likeCount != null ? likeCount : 6}">6</div>
                </div>
            </div>
            <div class="pr-stat-card pr-stat-card--listen">
                <div class="pr-stat-icon"><span class="material-symbols-outlined">headphones</span></div>
                <div>
                    <div class="pr-stat-label">DİNLEME</div>
                    <div class="pr-stat-value" th:text="${profile != null and profile.listenCount != null ? profile.listenCount : 25}">25</div>
                </div>
            </div>
        </div>

        <section class="pr-rec-section">
            <div class="pr-rec-header">
                <h2 class="pr-rec-title">
                    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
                    Senin İçin Öneriler
                </h2>
                <div class="pr-rec-nav">
                    <button type="button" class="pr-rec-nav-btn" id="recPrevBtn" aria-label="Önceki">
                        <span class="material-symbols-outlined">chevron_left</span>
                    </button>
                    <button type="button" class="pr-rec-nav-btn" id="recNextBtn" aria-label="Sonraki">
                        <span class="material-symbols-outlined">chevron_right</span>
                    </button>
                </div>
            </div>
            <div class="pr-rec-strip" id="recStrip">
                <div th:each="song : ${recommendations}" class="pr-rec-card">
                    <div class="pr-rec-cover-wrap">
                        <img th:src="${song.coverUrl}" 
                             th:alt="${song.title}" 
                             loading="lazy" 
                             onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=400&amp;q=80';" />
                        <span class="pr-rec-tag" 
                              th:classappend="${song.genre == 'Pop' ? 'pr-rec-tag--pop' : (song.genre == 'Elektronik' ? 'pr-rec-tag--elec' : (song.genre == 'Rock' ? 'pr-rec-tag--rock' : 'pr-rec-tag--synth'))}" 
                              th:text="${'#' + (song.genre != null ? #strings.toUpperCase(song.genre) : 'SYNTHWAVE')}">#SYNTHWAVE</span>
                    </div>
                    <div class="pr-rec-body">
                        <div class="pr-rec-info">
                            <h3 class="pr-rec-song-title" th:text="${song.title}" th:title="${song.title}">River of Darkness (feat. Timecop1983)</h3>
                            <p class="pr-rec-artist" th:text="${song.artist}">The Midnight</p>
                        </div>
                        <button type="button" class="pr-rec-play-btn queue-item"
                                th:attr="data-song-id=${song.songId},data-song-title=${song.title},data-song-artist=${song.artist}"
                                th:onclick="'player.playFrom(' + ${song.songId} + ')'"
                                title="Çal">
                            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <th:block layout:fragment="scripts">
        <script>
            function initRecCarousel() {
                const strip = document.getElementById('recStrip');
                const prevBtn = document.getElementById('recPrevBtn');
                const nextBtn = document.getElementById('recNextBtn');
                if (!strip || !prevBtn || !nextBtn) return;
                function updateNavState() {
                    prevBtn.disabled = strip.scrollLeft <= 4;
                    nextBtn.disabled = strip.scrollLeft >= strip.scrollWidth - strip.clientWidth - 4;
                }
                strip.addEventListener('scroll', updateNavState, { passive: true });
                window.addEventListener('resize', updateNavState);
                prevBtn.addEventListener('click', () => strip.scrollBy({ left: -320, behavior: 'smooth' }));
                nextBtn.addEventListener('click', () => strip.scrollBy({ left: 320, behavior: 'smooth' }));
                updateNavState();
            }
            window.addEventListener('DOMContentLoaded', initRecCarousel);

            function shareProfile() {
                const url = window.location.href;
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(url)
                        .then(() => notify('Profil bağlantısı kopyalandı.', 'success', 2000))
                        .catch(() => notify('Bağlantı kopyalanamadı.', 'error'));
                } else {
                    notify(url, 'info');
                }
            }
        </script>
    </th:block>
</body>
</html>
