<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<body>

    <div layout:fragment="title">Türler</div>
    <div layout:fragment="content">
        <div class="gn-header">
            <h2 class="gn-title">Boyutları Keşfet</h2>
            <p class="gn-subtitle">Frekans ızgarasına dal. Bir tür seç, o dünyaya geçiş yap.</p>
        </div>
        <div class="gn-grid">
            <a th:href="@{/search(q='Synthwave')}" class="gn-card gn-card--has-image" style="background-image:url('https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&amp;fit=crop&amp;w=400&amp;q=80');">
                <div class="gn-card-overlay"></div>
                <div class="gn-card-content">
                    <h3 class="gn-card-name">Synthwave</h3>
                    <div class="gn-card-meta">
                        <span class="gn-card-tag">#SYNTHWAVE</span>
                        <span class="gn-card-count">21 şarkı</span>
                    </div>
                </div>
            </a>
            <a th:href="@{/search(q='Elektronik')}" class="gn-card gn-card--has-image" style="background-image:url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&amp;fit=crop&amp;w=400&amp;q=80');">
                <div class="gn-card-overlay"></div>
                <div class="gn-card-content">
                    <h3 class="gn-card-name">Elektronik</h3>
                    <div class="gn-card-meta">
                        <span class="gn-card-tag">#ELEKTRONIK</span>
                        <span class="gn-card-count">12 şarkı</span>
                    </div>
                </div>
            </a>
            <a th:href="@{/search(q='Pop')}" class="gn-card gn-card--has-image" style="background-image:url('https://images.unsplash.com/photo-1470225620780-dba8ba36b745?auto=format&amp;fit=crop&amp;w=400&amp;q=80');">
                <div class="gn-card-overlay"></div>
                <div class="gn-card-content">
                    <h3 class="gn-card-name">Pop</h3>
                    <div class="gn-card-meta">
                        <span class="gn-card-tag">#POP</span>
                        <span class="gn-card-count">11 şarkı</span>
                    </div>
                </div>
            </a>
            <a th:href="@{/search(q='Rock')}" class="gn-card gn-card--has-image" style="background-image:url('https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&amp;fit=crop&amp;w=400&amp;q=80');">
                <div class="gn-card-overlay"></div>
                <div class="gn-card-content">
                    <h3 class="gn-card-name">Rock</h3>
                    <div class="gn-card-meta">
                        <span class="gn-card-tag">#ROCK</span>
                        <span class="gn-card-count">6 şarkı</span>
                    </div>
                </div>
            </a>
            <a th:href="@{/search(q='Jazz')}" class="gn-card gn-card--has-image" style="background-image:url('https://images.unsplash.com/photo-1511192336575-5a79af67a629?auto=format&amp;fit=crop&amp;w=400&amp;q=80');">
                <div class="gn-card-overlay"></div>
                <div class="gn-card-content">
                    <h3 class="gn-card-name">Jazz</h3>
                    <div class="gn-card-meta">
                        <span class="gn-card-tag">#JAZZ</span>
                        <span class="gn-card-count">5 şarkı</span>
                    </div>
                </div>
            </a>
        </div>
    </div>


</body>
</html>
