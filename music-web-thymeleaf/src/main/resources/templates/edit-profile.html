<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<body>

    <div layout:fragment="title">Profili Düzenle</div>
    <div layout:fragment="content">
        <h1 class="fv-title">Profili Düzenle</h1>
        <p class="fv-subtitle mb-4">Kişisel bilgilerinizi buradan güncelleyebilirsiniz.</p>
        
        <!-- Bildirim Mesajları -->
        <div th:if="${errorMessage}" class="alert-box alert-box--error" style="background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; border-radius: 10px; padding: 12px 18px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; max-width: 600px; margin-left: auto; margin-right: auto;">
            <span class="material-symbols-outlined" style="color: #ef4444;">error</span>
            <span th:text="${errorMessage}"></span>
        </div>
        <div th:if="${successMessage}" class="alert-box alert-box--success" style="background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.3); color: #6ee7b7; border-radius: 10px; padding: 12px 18px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; max-width: 600px; margin-left: auto; margin-right: auto;">
            <span class="material-symbols-outlined" style="color: #10b981;">check_circle</span>
            <span th:text="${successMessage}"></span>
        </div>

        <div class="card bg-dark text-white p-4 mx-auto" style="max-width: 600px; border: 1px solid var(--glass-border); border-radius: 16px;">
            <form th:action="@{/edit-profile}" method="post" data-turbo="false">
                <div class="mb-3">
                    <label class="form-label text-secondary" for="fullName">Ad Soyad</label>
                    <input type="text" id="fullName" name="fullName" class="form-control bg-dark text-white border-secondary" th:value="${profile != null ? profile.fullName : (currentUser != null ? currentUser : '')}" placeholder="Ad Soyad" />
                </div>
                <div class="mb-3">
                    <label class="form-label text-secondary" for="username">Kullanıcı Adı</label>
                    <input type="text" id="username" name="username" class="form-control bg-dark text-white border-secondary" th:value="${profile != null ? profile.username : ''}" placeholder="Kullanıcı Adı" />
                </div>
                <div class="mb-3">
                    <label class="form-label text-secondary" for="email">E-posta</label>
                    <input type="email" id="email" name="email" required="required" class="form-control bg-dark text-white border-secondary" th:value="${profile != null ? profile.email : (currentUser != null ? currentUser : '')}" placeholder="ornek@domain.com" />
                </div>
                <div class="mb-3">
                    <label class="form-label text-secondary" for="bio">Hakkımda</label>
                    <textarea id="bio" name="bio" class="form-control bg-dark text-white border-secondary" rows="3" th:text="${profile != null ? profile.bio : 'Müzik tutkunu, yazılım geliştirici.'}" placeholder="Kendinizden bahsedin..."></textarea>
                </div>
                
                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a th:href="@{/profile}" class="btn btn-outline-secondary">İptal</a>
                    <button type="submit" class="btn btn-primary" style="background: var(--brand-primary); border: none; font-weight: 600; padding: 8px 24px;">Güncelle</button>
                </div>
            </form>
        </div>
    </div>


</body>
</html>
