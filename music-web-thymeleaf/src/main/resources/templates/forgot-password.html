<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<body>

    <div layout:fragment="title">Şifremi Unuttum</div>
    <div layout:fragment="content">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-12 col-md-8 col-lg-5">
                <div class="card bg-dark text-white p-4 shadow-lg" style="border: 1px solid var(--glass-border); border-radius: 16px;">
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <span class="material-symbols-outlined text-primary" style="font-size: 3rem; font-variation-settings: 'FILL' 1;">lock_reset</span>
                            <h2 class="fw-bold mt-2">Şifremi Unuttum</h2>
                            <p class="text-secondary">E-posta adresinizi girin, size sıfırlama bağlantısı gönderelim.</p>
                        </div>
                        
                        <h:form pt:data-turbo="false">
                            <div class="mb-4">
                                <label class="form-label text-secondary small text-uppercase fw-semibold">E-Posta Adresi</label>
                                <input type="email" class="form-control bg-dark text-white border-secondary" placeholder="mail@ornek.com" />
                            </div>
                            
                            <button type="button" class="btn w-100 fw-bold mb-3" style="background: var(--brand-primary); color: #fff; padding: 0.8rem;" onclick="notify('Şifre sıfırlama bağlantısı e-posta adresinize gönderildi!', 'success'); setTimeout(() => window.location.href='login.xhtml', 2500);">Bağlantı Gönder</button>
                            
                            <div class="text-center mt-4">
                                <a href="login.xhtml" class="text-secondary text-decoration-none">Giriş sayfasına dön</a>
                            </div>
                        </h:form>
                    </div>
                </div>
            </div>
        </div>
    </div>


</body>
</html>
