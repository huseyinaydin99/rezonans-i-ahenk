<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">

<head>
    <title>Sisteme Katıl - Rezonans-ı Ahenk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>
        .register-bg { background: linear-gradient(135deg, #1f1c2c 0%, #928DAB 100%); min-height: 100vh; }
        .register-card { background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px); border-radius: 15px; border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>

<body class="register-bg d-flex align-items-center justify-content-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card register-card text-white shadow-lg p-4">
                    <div class="text-center mb-4">
                        <i class="fa-solid fa-music fa-3x text-info mb-3"></i>
                        <h3 class="fw-bold">Müzik Evrenine Katıl</h3>
                        <p class="text-light small">Hemen ücretsiz hesap oluştur ve keşfetmeye başla.</p>
                    </div>

                    <h:form pt:data-turbo="false" xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" id="registerForm">
                        
                        <!-- AJAX Sonuç Mesajı -->
                        <h:panelGroup id="resultMsg">
                            <h:outputText value="#{registerBean.message}" 
                                          styleClass="alert #{registerBean.success ? 'alert-success' : 'alert-danger'} d-block mb-3 fw-bold" 
                                          rendered="#{not empty registerBean.message}" />
                            <h:panelGroup rendered="#{registerBean.success}">
                                <script>
                                    setTimeout(function() {
                                        window.location.href = 'login.xhtml';
                                    }, 2000);
                                </script>
                            </h:panelGroup>
                        </h:panelGroup>

                        <div class="mb-3">
                            <label class="form-label text-light"><i class="fa-solid fa-user me-2"></i>Kullanıcı Adı</label>
                            <h:inputText value="#{registerBean.username}" class="form-control bg-dark text-white border-secondary" required="true" />
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label text-light"><i class="fa-solid fa-envelope me-2"></i>E-Posta</label>
                            <h:inputText value="#{registerBean.email}" class="form-control bg-dark text-white border-secondary" required="true" />
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-light"><i class="fa-solid fa-lock me-2"></i>Şifre</label>
                            <h:inputSecret value="#{registerBean.password}" class="form-control bg-dark text-white border-secondary" required="true" />
                        </div>

                        <div class="form-check form-switch mb-4">
                            <h:selectBooleanCheckbox value="#{registerBean.artistAccount}" class="form-check-input bg-info border-0" id="artistSwitch" />
                            <label class="form-check-label text-light" for="artistSwitch">
                                <i class="fa-solid fa-microphone-lines me-1"></i> Ben bir sanatçıyım (Eser yayınlamak istiyorum)
                            </label>
                        </div>

                        <h:commandButton value="Ücretsiz Kayıt Ol" action="#{registerBean.doRegister}" styleClass="btn btn-info text-dark w-100 fw-bold py-2 rounded-3">
                            <!-- Sayfa yenilenmesini engeller, güvenli AJAX akışı sağlar -->
                            <f:ajax execute="@form" render="resultMsg" />
                        </h:commandButton>
                    </h:form>
                    
                    <div class="text-center mt-4">
                        <small class="text-light">Zaten hesabın var mı? <a href="login.xhtml" class="text-info text-decoration-none fw-bold">Giriş Yap</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
