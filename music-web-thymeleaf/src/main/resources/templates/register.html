<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{auth-layout}">
<head>
    <title>Sisteme Katıl - Rezonans-ı Ahenk</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="container d-flex align-items-center justify-content-center" style="min-height: 80vh;">
            <div class="row justify-content-center w-100">
                <div class="col-md-5">
                    <div class="card text-white shadow-lg p-4" style="background: rgba(31, 28, 44, 0.7); backdrop-filter: blur(10px); border-radius: 15px; border: 1px solid rgba(255, 255, 255, 0.1);">
                        <div class="text-center mb-4">
                            <span class="material-symbols-outlined mb-3" style="font-size: 48px; color: #0dcaf0;">music_note</span>
                            <h3 class="fw-bold">Müzik Evrenine Katıl</h3>
                            <p class="text-light small">Hemen ücretsiz hesap oluştur ve keşfetmeye başla.</p>
                        </div>

                        <!-- Hata/Başarı Mesajları -->
                        <div th:if="${error != null}" class="alert alert-danger d-block mb-3 fw-bold" th:text="${error}"></div>
                        <div th:if="${message != null}" class="alert alert-success d-block mb-3 fw-bold">
                            <span th:text="${message}"></span>
                            <script>
                                setTimeout(function() {
                                    if (typeof Turbo !== 'undefined') {
                                        Turbo.visit('/music-credit-system/login');
                                    } else {
                                        window.location.href = '/music-credit-system/login';
                                    }
                                }, 2000);
                            </script>
                        </div>

                        <form th:action="@{/doRegister}" method="post">
                            <div class="mb-3">
                                <label class="form-label text-light">Kullanıcı Adı</label>
                                <input type="text" name="username" class="form-control bg-dark text-white border-secondary" required="required" />
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label text-light">E-Posta</label>
                                <input type="email" name="email" class="form-control bg-dark text-white border-secondary" required="required" />
                            </div>

                            <div class="mb-4">
                                <label class="form-label text-light">Şifre</label>
                                <input type="password" name="password" class="form-control bg-dark text-white border-secondary" required="required" />
                            </div>

                            <div class="form-check form-switch mb-4">
                                <input type="checkbox" name="artistAccount" class="form-check-input bg-info border-0" id="artistSwitch" />
                                <label class="form-check-label text-light" for="artistSwitch">
                                    Ben bir sanatçıyım (Eser yayınlamak istiyorum)
                                </label>
                            </div>

                            <button type="submit" class="btn btn-info text-dark w-100 fw-bold py-2 rounded-3">
                                Ücretsiz Kayıt Ol
                            </button>
                        </form>
                        
                        <div class="text-center mt-4">
                            <small class="text-light">Zaten hesabın var mı? <a th:href="@{/login}" class="text-info text-decoration-none fw-bold">Giriş Yap</a></small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
