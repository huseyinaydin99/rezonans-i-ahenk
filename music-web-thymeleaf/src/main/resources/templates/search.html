<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>Arama Sonuçları</title>
</head>
<body>
    <div layout:fragment="content">
        <h1 class="fv-title">Arama Sonuçları</h1>
        <p class="fv-subtitle mb-4">
            "<span th:text="${q != null and !q.isEmpty() ? q : 'Tüm Şarkılar'}"></span>" için arama sonuçları listeleniyor.
        </p>
        
        <div id="searchResults" class="mg-grid mt-4">
            <div th:if="${songs == null or songs.isEmpty()}" class="alert alert-warning" style="background: rgba(255, 193, 7, 0.1); border: 1px solid rgba(255, 193, 7, 0.3); color: #ffc107; grid-column: 1 / -1; padding: 16px; border-radius: 8px;">
                Aradığınız kriterlere uygun şarkı bulunamadı.
            </div>

            <div th:each="song : ${songs}" 
                 th:class="'mg-card ' + (${song.tier == 'Premium'} ? 'mg-card--tier-2' : (${song.tier == 'Elit'} ? 'mg-card--tier-3' : 'mg-card--tier-1'))">
                <div class="mg-card-cover">
                    <img th:src="${song.cover != null ? song.cover : 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300'}" th:alt="${song.title}" />
                    <div class="mg-card-play-overlay">
                        <button class="mg-card-play queue-item" 
                                th:data-song-id="${song.id}" 
                                th:data-song-title="${song.title}" 
                                th:data-song-artist="${song.artist}" 
                                th:onclick="|player.playFrom(${song.id})|" 
                                title="Oynat">
                            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
                        </button>
                    </div>
                </div>
                <div class="mg-card-title-row">
                    <h4 class="mg-card-title" th:text="${song.title}"></h4>
                    <span class="mg-badge" th:text="${song.tier != null ? song.tier : 'Basic'}"></span>
                </div>
                <p class="mg-card-artist">
                    <span th:text="${song.artist}"></span>
                    <span th:if="${song.genre != null}" class="text-secondary" style="font-size: 0.85em;" th:text="' • ' + ${song.genre}"></span>
                </p>
                <div class="mg-card-actions">
                    <button class="mg-icon-btn like-btn" 
                            th:classappend="${likedSongIds != null and likedSongIds.contains(song.id)} ? 'text-danger' : 'text-muted'"
                            th:data-song-id="${song.id}" 
                            th:onclick="|toggleLike(${song.id}, this)|" 
                            th:title="${likedSongIds != null and likedSongIds.contains(song.id)} ? 'Beğeniyi kaldır' : 'Beğen'"
                            th:text="${likedSongIds != null and likedSongIds.contains(song.id)} ? '♥' : '♡'">&#9825;</button>
                    <button class="mg-icon-btn" th:onclick="|addToPlaylist(${song.id})|" title="Playlist'e ekle">
                        <span class="material-symbols-outlined">playlist_add</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <th:block layout:fragment="scripts">
    </th:block>
</body>
</html>
