<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="triBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#160829" />
      <stop offset="100%" stop-color="#070410" />
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0080" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>
    <filter id="triGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="200" height="200" rx="100" fill="url(#triBg)" />
  <circle cx="100" cy="100" r="92" fill="none" stroke="rgba(121, 40, 202, 0.4)" stroke-width="2" />
  
  <!-- Cyber Grid -->
  <g opacity="0.25" stroke="#00f2fe" stroke-width="1">
    <line x1="30" y1="140" x2="170" y2="140" />
    <line x1="45" y1="155" x2="155" y2="155" />
    <line x1="60" y1="170" x2="140" y2="170" />
    <line x1="100" y1="130" x2="100" y2="180" />
    <line x1="75" y1="130" x2="65" y2="180" />
    <line x1="125" y1="130" x2="135" y2="180" />
  </g>

  <!-- Glowing Inverted Triangle -->
  <polygon points="100,160 40,55 160,55" fill="none" stroke="url(#neonPink)" stroke-width="4" filter="url(#triGlow)" />
  <polygon points="100,150 48,60 152,60" fill="none" stroke="#00f2fe" stroke-width="1.5" opacity="0.6" />

  <!-- Synthwave Script Typography -->
  <text x="100" y="112" text-anchor="middle" font-family="'Brush Script MT', cursive, sans-serif" font-weight="700" font-size="28" font-style="italic" fill="#ffffff" filter="url(#triGlow)">Synthwave</text>
  <text x="100" y="112" text-anchor="middle" font-family="'Brush Script MT', cursive, sans-serif" font-weight="700" font-size="28" font-style="italic" fill="#ff70a6">Synthwave</text>
</svg>
