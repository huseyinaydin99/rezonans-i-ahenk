<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="skyG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a051b" />
      <stop offset="60%" stop-color="#2a0845" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
    <filter id="cityGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Circular background -->
  <rect width="200" height="200" rx="100" fill="url(#skyG)" />
  <circle cx="100" cy="100" r="92" fill="none" stroke="rgba(0, 242, 254, 0.4)" stroke-width="2" />

  <!-- Cyber Skyline Silhouette -->
  <polygon points="20,130 35,110 45,110 50,130 65,95 78,95 82,130 95,85 110,85 115,130 130,105 145,105 150,130 165,115 180,130 180,140 20,140" fill="#120626" opacity="0.9" />

  <!-- Neon Window / Billboard Dots -->
  <g fill="#00f2fe" opacity="0.8">
    <circle cx="68" cy="102" r="1.5" />
    <circle cx="74" cy="108" r="1.5" />
    <circle cx="100" cy="92" r="1.5" />
    <circle cx="104" cy="98" r="1.5" />
    <circle cx="135" cy="112" r="1.5" />
  </g>
  <g fill="#ff2a85" opacity="0.8">
    <circle cx="71" cy="115" r="1.5" />
    <circle cx="102" cy="106" r="1.5" />
    <circle cx="140" cy="118" r="1.5" />
  </g>

  <!-- Car Dashboard Steering Wheel Foreground Silhouette -->
  <path d="M 20 150 Q 100 130 180 150 L 180 200 L 20 200 Z" fill="#08070d" />
  <ellipse cx="100" cy="170" rx="55" ry="24" fill="none" stroke="#1f2333" stroke-width="6" />
  <!-- Neon Instrument Cluster Glow -->
  <ellipse cx="75" cy="155" rx="12" ry="7" fill="none" stroke="#00f2fe" stroke-width="2" filter="url(#cityGlow)" />
  <ellipse cx="125" cy="155" rx="12" ry="7" fill="none" stroke="#ff007f" stroke-width="2" filter="url(#cityGlow)" />
</svg>
