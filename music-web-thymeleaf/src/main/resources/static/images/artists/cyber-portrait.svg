<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="sereneBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0845" />
      <stop offset="60%" stop-color="#140727" />
      <stop offset="100%" stop-color="#070210" />
    </linearGradient>
    <linearGradient id="hairG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
    <filter id="sereneGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="200" height="200" rx="100" fill="url(#sereneBg)" />
  <circle cx="100" cy="100" r="92" fill="none" stroke="rgba(255, 0, 127, 0.4)" stroke-width="2" />

  <!-- Cyberpunk Anime Portrait Silhouette -->
  <g transform="translate(100, 105)">
    <!-- Hair background buns/twin tails -->
    <circle cx="-35" cy="-28" r="16" fill="url(#hairG)" filter="url(#sereneGlow)" />
    <circle cx="35" cy="-28" r="16" fill="url(#hairG)" filter="url(#sereneGlow)" />
    
    <!-- Face / Head -->
    <path d="M -22 -15 Q -24 15, 0 30 Q 24 15, 22 -15 Q 22 -35, 0 -35 Q -22 -35, -22 -15 Z" fill="#ffd1dc" />
    
    <!-- Hair Bangs -->
    <path d="M -26 -15 Q -10 -40, 0 -15 Q 10 -40, 26 -15 Q 28 -42, 0 -42 Q -28 -42, -26 -15 Z" fill="url(#hairG)" filter="url(#sereneGlow)" />
    
    <!-- Cyber Visor / Neon Eyes -->
    <path d="M -16 -4 L 16 -4 L 12 4 L -12 4 Z" fill="#00f2fe" filter="url(#sereneGlow)" />
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#ffffff" stroke-width="1" />
    
    <!-- Neck & Cyber Collar -->
    <path d="M -8 26 L -8 40 L 8 40 L 8 26 Z" fill="#e2a8b8" />
    <path d="M -30 40 L -12 35 L 12 35 L 30 40 L 45 65 L -45 65 Z" fill="#1b1c2b" stroke="#00f2fe" stroke-width="1.5" />
    <!-- Collar Neon Line -->
    <line x1="-15" y1="42" x2="15" y2="42" stroke="#ff007f" stroke-width="2" filter="url(#sereneGlow)" />
  </g>

  <!-- Typography -->
  <text x="100" y="42" text-anchor="middle" font-family="'Syne', sans-serif" font-weight="700" font-size="11" letter-spacing="3" fill="#00f2fe">SERENE</text>
</svg>
