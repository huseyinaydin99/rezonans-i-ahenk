<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="sqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <filter id="sqGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="200" height="200" rx="100" fill="url(#sqBg)" />
  <circle cx="100" cy="100" r="92" fill="none" stroke="rgba(0, 242, 254, 0.3)" stroke-width="2" />
  
  <!-- Outer Glow Square -->
  <rect x="52" y="52" width="96" height="96" rx="8" fill="none" stroke="#00f2fe" stroke-width="3.5" filter="url(#sqGlow)" />
  <rect x="62" y="62" width="76" height="76" rx="4" fill="none" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1" />

  <!-- Inner Soft Square Fill -->
  <rect x="54" y="54" width="92" height="92" rx="6" fill="#00f2fe" opacity="0.08" />
  
  <text x="100" y="105" text-anchor="middle" font-family="'DM Sans', sans-serif" font-weight="700" font-size="11" letter-spacing="1" fill="#ffffff" opacity="0.9">ROYALTY FREE</text>
  <text x="100" y="120" text-anchor="middle" font-family="'DM Sans', sans-serif" font-weight="500" font-size="9" letter-spacing="0.5" fill="#00f2fe" opacity="0.8">BACKGROUND</text>
</svg>
