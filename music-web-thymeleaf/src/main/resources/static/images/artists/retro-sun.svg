<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18132b" />
      <stop offset="100%" stop-color="#090614" />
    </linearGradient>
    <linearGradient id="sunG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="35%" stop-color="#f97316" />
      <stop offset="70%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <mask id="sunMask">
      <circle cx="100" cy="100" r="82" fill="#fff" />
      <!-- Horizontal Retro Stripes Cutout -->
      <rect x="0" y="98" width="200" height="3" fill="#000" />
      <rect x="0" y="107" width="200" height="4.5" fill="#000" />
      <rect x="0" y="118" width="200" height="6.5" fill="#000" />
      <rect x="0" y="131" width="200" height="9" fill="#000" />
      <rect x="0" y="147" width="200" height="12" fill="#000" />
      <rect x="0" y="166" width="200" height="16" fill="#000" />
    </mask>
  </defs>
  
  <rect width="200" height="200" rx="100" fill="url(#bgG)" />
  <circle cx="100" cy="100" r="92" fill="none" stroke="rgba(236, 72, 153, 0.4)" stroke-width="2" />
  <circle cx="100" cy="100" r="82" fill="url(#sunG)" mask="url(#sunMask)" filter="url(#glow)" />
</svg>
