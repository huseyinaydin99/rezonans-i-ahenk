<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="saxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0b2e" />
      <stop offset="50%" stop-color="#11071f" />
      <stop offset="100%" stop-color="#08020f" />
    </linearGradient>
    <linearGradient id="goldSax" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="60%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="saxGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="200" height="200" rx="100" fill="url(#saxBg)" />
  <circle cx="100" cy="100" r="92" fill="none" stroke="rgba(168, 85, 247, 0.4)" stroke-width="2" />

  <!-- Neon Spotlight Waves -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.3" stroke-dasharray="4 4" />
  <circle cx="100" cy="100" r="50" fill="none" stroke="#00f2fe" stroke-width="1" opacity="0.2" />

  <!-- Saxophone Silhouette & Instrument -->
  <g transform="translate(100, 105) scale(0.85)">
    <!-- Body curve of Sax -->
    <path d="M -15 -45 L -10 10 C -10 35, 20 40, 25 10 L 25 -5 C 28 -10, 36 -10, 38 -5 L 35 15 C 30 50, -25 45, -22 10 L -25 -45 Z" fill="url(#goldSax)" filter="url(#saxGlow)" />
    <!-- Bell Flare -->
    <ellipse cx="28" cy="-5" rx="12" ry="7" fill="url(#goldSax)" stroke="#fde047" stroke-width="1.5" />
    <!-- Mouthpiece -->
    <path d="M -20 -45 Q -25 -60, -35 -65 L -32 -68 Q -20 -63, -15 -45 Z" fill="#eab308" />
    <!-- Keys -->
    <circle cx="-7" cy="-20" r="2.5" fill="#ffffff" />
    <circle cx="-8" cy="-10" r="2.5" fill="#ffffff" />
    <circle cx="-9" cy="0" r="2.5" fill="#ffffff" />
  </g>

  <!-- Typography -->
  <text x="100" y="48" text-anchor="middle" font-family="'DM Sans', sans-serif" font-weight="800" font-size="10" letter-spacing="2" fill="#00f2fe">MIDNIGHT SAX</text>
</svg>
