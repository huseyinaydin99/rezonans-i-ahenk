<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="lhBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f0a24" />
      <stop offset="100%" stop-color="#07030a" />
    </linearGradient>
    <filter id="carGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="200" height="200" rx="100" fill="url(#lhBg)" />
  <circle cx="100" cy="100" r="92" fill="none" stroke="rgba(255, 42, 133, 0.4)" stroke-width="2" />

  <!-- Retro Sun Behind Car -->
  <path d="M 50 110 A 50 50 0 0 1 150 110 Z" fill="#ff70a6" opacity="0.3" />

  <!-- Ground Cyber Grid -->
  <g stroke="#00f2fe" stroke-width="1" opacity="0.4">
    <line x1="20" y1="140" x2="180" y2="140" />
    <line x1="30" y1="155" x2="170" y2="155" />
    <line x1="45" y1="170" x2="155" y2="170" />
    <line x1="100" y1="125" x2="100" y2="180" />
    <line x1="80" y1="125" x2="70" y2="180" />
    <line x1="120" y1="125" x2="130" y2="180" />
  </g>

  <!-- Cyberpunk Wedge Sport Car (Front View) -->
  <g transform="translate(100, 115)">
    <!-- Roof / Windshield -->
    <polygon points="-22,-20 22,-20 32,-2 -32,-2" fill="#00f2fe" opacity="0.8" filter="url(#carGlow)" />
    <!-- Hood & Fenders -->
    <polygon points="-40,0 40,0 48,15 -48,15" fill="#181a24" stroke="#ff2a85" stroke-width="1.5" />
    <!-- Bumper / Grille -->
    <polygon points="-48,15 48,15 42,26 -42,26" fill="#0b0e14" />
    <!-- Glowing Headlights -->
    <rect x="-38" y="5" width="16" height="5" rx="2" fill="#00f2fe" filter="url(#carGlow)" />
    <rect x="22" y="5" width="16" height="5" rx="2" fill="#00f2fe" filter="url(#carGlow)" />
    <!-- Neon Underglow -->
    <line x1="-35" y1="26" x2="35" y2="26" stroke="#ff2a85" stroke-width="4" filter="url(#carGlow)" />
  </g>

  <!-- Top Title -->
  <text x="100" y="44" text-anchor="middle" font-family="'Syne', sans-serif" font-weight="900" font-size="12" letter-spacing="3" fill="#ff2a85">LAZERHAWK</text>
</svg>
