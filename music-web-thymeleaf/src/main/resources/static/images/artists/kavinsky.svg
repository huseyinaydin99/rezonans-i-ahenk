<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="kavBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c0f18" />
      <stop offset="100%" stop-color="#0a0508" />
    </linearGradient>
    <filter id="kavGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="200" height="200" rx="100" fill="url(#kavBg)" />
  <circle cx="100" cy="100" r="92" fill="none" stroke="rgba(239, 68, 68, 0.4)" stroke-width="2" />

  <!-- Kavinsky Silhouette Face -->
  <g transform="translate(100, 95)">
    <!-- Hair & Head Outline -->
    <path d="M -45 -10 Q -50 -55, 0 -60 Q 50 -55, 45 -10 L 40 40 Q 0 65, -40 40 Z" fill="#0f111a" stroke="#252a3d" stroke-width="2" />
    <!-- Collar Jacket -->
    <path d="M -50 35 L -20 60 L 20 60 L 50 35 L 60 70 L -60 70 Z" fill="#180b11" stroke="#ff2a2a" stroke-width="1.5" />
    <!-- Glowing Red Wayfarer Shades -->
    <path d="M -38 -5 L -5 -5 L -10 15 L -35 15 Z" fill="#ff1f1f" filter="url(#kavGlow)" />
    <path d="M 5 -5 L 38 -5 L 35 15 L 10 15 Z" fill="#ff1f1f" filter="url(#kavGlow)" />
    <rect x="-6" y="-3" width="12" height="4" fill="#ff1f1f" />
    <!-- White Glare on Sunglasses -->
    <line x1="-30" y1="-2" x2="-20" y2="12" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <line x1="14" y1="-2" x2="24" y2="12" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Brand Typography -->
  <text x="100" y="42" text-anchor="middle" font-family="'Syne', sans-serif" font-weight="900" font-size="12" letter-spacing="4" fill="#ff2a2a">KAVINSKY</text>
</svg>
