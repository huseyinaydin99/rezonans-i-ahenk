<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="artistBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111726" />
      <stop offset="50%" stop-color="#0c0e18" />
      <stop offset="100%" stop-color="#05060a" />
    </linearGradient>
    <linearGradient id="neonCyanPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#ff0080" />
    </linearGradient>
    <filter id="artistGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Circular/Rounded Base -->
  <rect width="400" height="400" rx="200" fill="url(#artistBgGrad)" />

  <!-- Outer Neon Ring -->
  <circle cx="200" cy="200" r="190" fill="none" stroke="url(#neonCyanPink)" stroke-width="4" filter="url(#artistGlow)" opacity="0.9" />
  <circle cx="200" cy="200" r="178" fill="none" stroke="rgba(0, 242, 254, 0.2)" stroke-width="1.5" stroke-dasharray="8 6" />

  <!-- Artist Silhouette / Icon -->
  <g fill="none" stroke="url(#neonCyanPink)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" transform="translate(200, 185)">
    <!-- Head -->
    <circle cx="0" cy="-45" r="38" fill="rgba(255, 255, 255, 0.05)" />
    <!-- Headphones -->
    <path d="M -48 -45 A 48 48 0 0 1 48 -45" stroke="#00f2fe" stroke-width="5" />
    <rect x="-56" y="-55" width="16" height="26" rx="8" fill="#00f2fe" opacity="0.8" />
    <rect x="40" y="-55" width="16" height="26" rx="8" fill="#00f2fe" opacity="0.8" />
    <!-- Shoulders / Torso -->
    <path d="M -75 60 C -70 15, -40 5, 0 5 C 40 5, 70 15, 75 60 Z" fill="rgba(255, 255, 255, 0.04)" />
  </g>

  <!-- Typography -->
  <text x="200" y="315" text-anchor="middle" font-family="'Syne', 'DM Sans', sans-serif" font-weight="700" font-size="14" letter-spacing="4" fill="#00f2fe" opacity="0.9">SANATÇI</text>
  <text x="200" y="335" text-anchor="middle" font-family="'DM Sans', sans-serif" font-weight="500" font-size="11" letter-spacing="2" fill="#ffffff" opacity="0.6">REZONANS-I AHENK</text>
</svg>
