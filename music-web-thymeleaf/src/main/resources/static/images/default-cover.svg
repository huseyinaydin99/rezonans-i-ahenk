<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141829" />
      <stop offset="50%" stop-color="#0f111c" />
      <stop offset="100%" stop-color="#07080d" />
    </linearGradient>
    <linearGradient id="neonPinkCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a85" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="16" fill="url(#bgGrad)" />

  <!-- Retro Sun / Wave Grid Background -->
  <g opacity="0.15">
    <line x1="0" y1="320" x2="400" y2="320" stroke="#00f2fe" stroke-width="1" />
    <line x1="0" y1="340" x2="400" y2="340" stroke="#00f2fe" stroke-width="1.5" />
    <line x1="0" y1="365" x2="400" y2="365" stroke="#ff2a85" stroke-width="2" />
    <line x1="0" y1="395" x2="400" y2="395" stroke="#ff2a85" stroke-width="2.5" />
    <line x1="80" y1="300" x2="20" y2="400" stroke="#00f2fe" stroke-width="1" />
    <line x1="160" y1="300" x2="140" y2="400" stroke="#00f2fe" stroke-width="1" />
    <line x1="240" y1="300" x2="260" y2="400" stroke="#00f2fe" stroke-width="1" />
    <line x1="320" y1="300" x2="380" y2="400" stroke="#00f2fe" stroke-width="1" />
  </g>

  <!-- Vinyl Record -->
  <circle cx="200" cy="180" r="120" fill="#11131a" stroke="url(#neonPinkCyan)" stroke-width="3" filter="url(#neonGlow)" />
  <circle cx="200" cy="180" r="105" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <circle cx="200" cy="180" r="90" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
  <circle cx="200" cy="180" r="75" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  
  <!-- Vinyl Center Label -->
  <circle cx="200" cy="180" r="45" fill="url(#neonPinkCyan)" opacity="0.9" />
  <circle cx="200" cy="180" r="14" fill="#0b0e14" />

  <!-- Music Note Icon in Center -->
  <path d="M195 160 v30 a8 8 0 1 1 -6 -7.7 v-22.3 h20 v16 a8 8 0 1 1 -6 -7.7 v-12.3 z" fill="#ffffff" opacity="0.9" />

  <!-- Bottom Brand Typography -->
  <text x="200" y="345" text-anchor="middle" font-family="'Syne', 'DM Sans', sans-serif" font-weight="700" font-size="16" letter-spacing="4" fill="#ffffff" opacity="0.85">REZONANS-I AHENK</text>
  <text x="200" y="368" text-anchor="middle" font-family="'DM Sans', sans-serif" font-weight="500" font-size="12" letter-spacing="2" fill="url(#neonPinkCyan)">RETRO MUSIC</text>
</svg>
