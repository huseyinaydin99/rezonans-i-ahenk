version: '3.8'

services:
  music-db:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      - ORACLE_PASSWORD=MusicSecretPassword123
      - APP_USER=music_app
      - APP_PASSWORD=music_app_pwd
    ports:
      - "1521:1521"
    volumes:
      - oradata:/opt/oracle/oradata
    networks:
      - music-network

  music-app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@music-db:1521/FREE
      - SPRING_DATASOURCE_USERNAME=music_app
      - SPRING_DATASOURCE_PASSWORD=music_app_pwd
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      - music-db
    networks:
      - music-network

networks:
  music-network:
    driver: bridge

volumes:
  oradata:
