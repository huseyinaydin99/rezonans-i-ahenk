version: '3.8'

services:
  music-db:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      - ORACLE_PASSWORD=MusicSecretPassword123
      - APP_USER=music_app
      - APP_USER_PASSWORD=music_app_pwd
    ports:
      - "1521:1521"
    volumes:
      - oradata:/opt/oracle/oradata
    networks:
      - music-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: music_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - music-network

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: music_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - music-network

  prometheus:
    image: prom/prometheus:v2.44.0
    container_name: music_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - music-network

  grafana:
    image: grafana/grafana:9.5.1
    container_name: music_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - music-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.8.0
    container_name: music_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    networks:
      - music-network

  keycloak:
    image: quay.io/keycloak/keycloak:21.1.1
    container_name: music_keycloak
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    command: start-dev
    ports:
      - "8081:8080"
    networks:
      - music-network

  cassandra:
    image: cassandra:4.1.1
    container_name: music_cassandra
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=MusicCluster
      - CASSANDRA_DC=dc1
      - CASSANDRA_RACK=rack1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - HEAP_NEWSIZE=256M
      - MAX_HEAP_SIZE=512M
    networks:
      - music-network

  jaeger:
    image: jaegertracing/all-in-one:1.45
    container_name: music_jaeger
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    ports:
      - "16686:16686" # UI
      - "9411:9411"   # Zipkin API port
      - "4317:4317"   # OpenTelemetry OTLP gRPC port
      - "4318:4318"   # OpenTelemetry OTLP HTTP port
    networks:
      - music-network

  spark-master:
    image: bde2020/spark-master:3.3.0-hadoop3.3
    container_name: music_spark_master
    environment:
      - INIT_DAEMON_STEP=setup_spark
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8082:8080" # Web UI
      - "7077:7077" # Master Port
    networks:
      - music-network

  spark-worker:
    image: bde2020/spark-master:3.3.0-hadoop3.3
    container_name: music_spark_worker
    depends_on:
      - spark-master
    environment:
      - INIT_DAEMON_STEP=setup_spark
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_CORES=1
    ports:
      - "8083:8081"
    networks:
      - music-network

networks:
  music-network:
    driver: bridge

volumes:
  oradata:
