version: '3.8'

services:
  music-db:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      - ORACLE_PASSWORD=MusicSecretPassword123
      - APP_USER=music_app
      - APP_PASSWORD=music_app_pwd
    ports:
      - "1521:1521"
    volumes:
      - oradata:/opt/oracle/oradata
    networks:
      - music-network

  music-app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@music-db:1521/FREE
      - SPRING_DATASOURCE_USERNAME=music_app
      - SPRING_DATASOURCE_PASSWORD=music_app_pwd
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      - music-db
    networks:
      - music-network

networks:
  music-network:
    driver: bridge

volumes:
  oradata:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: music_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: music_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
