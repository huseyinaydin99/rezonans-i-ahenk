apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: music-platform-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: api.rezonans-music.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: music-core-service
            port:
              number: 80
