apiVersion: v1
kind: Service
metadata:
  name: music-core-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: music-core
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
    - name: grpc
      protocol: TCP
      port: 9090
      targetPort: 9090
